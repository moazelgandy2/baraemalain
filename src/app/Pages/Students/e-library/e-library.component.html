<div class="page-title" data-aos="fade">
  <div class="heading">
    <div class="container justify-content-center text-center">
      <div class="row d-flex justify-content-center text-center">
        <div class="col-lg text-nowrap">
          <h1>{{ 'pages.elibrary.title' | translate }}</h1>
        </div>
      </div>
    </div>
  </div>
  <nav class="breadcrumbs">
    <div class="container">
      <ol>
        <li><a href="index.html">{{ 'common.breadcrumb_home' | translate }}</a></li>
        <li class="current">{{ 'pages.elibrary.breadcrumb_current' | translate }}</li>
      </ol>
    </div>
  </nav>
</div>

<section id="events" class="events section">
  <div class="container" data-aos="fade-up">
    <h2 class="col text-dark text-center" data-aos="fade-up" data-aos-delay="50">
      {{ 'pages.elibrary.intro' | translate }}

    </h2>
    <br>
    <hr>
    <div class="row">
      <div *ngFor="let book of Books" class="col-lg-4 d-flex align-items-center" >
          <a class="book-img" [href]="book.URL" target="_blank" data-aos="fade-up" data-aos-delay="100">
            <img [src]="book.Pic" [alt]="book.Name">
            <div class="overlay">
              <div class="text text-nowrap">
                <h3>{{book.Name}}</h3>
                <p style="color: white;"> Written by <strong>{{book.Author}}</strong></p>
                <!-- <p style="color: silver; ">{{book.Year}}</p> -->
              </div>
            </div>
          </a>
      </div>
    </div>
  </div>
</section>
