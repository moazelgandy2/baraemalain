<div class="page-title" data-aos="fade">
  <div class="heading">
    <div class="container">
      <div class="row d-flex justify-content-center text-center">
        <div class="col-lg-2 text-nowrap">
          <h1>{{ 'pages.nationalIdGallery.title' | translate }}</h1>
        </div>
      </div>
    </div>
  </div>
  <nav class="breadcrumbs">
    <div class="container">
      <ol>
        <li><a href="index.html">{{ 'common.breadcrumb_home' | translate }}</a></li>
        <li class="current">{{ 'pages.nationalIdGallery.breadcrumb_current' | translate }}</li>
      </ol>
    </div>
  </nav>

<section id="events" class="section about-us">
  <div class="container text-center">
    <div class="row"  *ngFor="let pic of pics">
      <div class="col-lg p-3">
        <img [src]="'assets/img/National ID/img ('+pic+').png'" class="img-fluid">
      </div>
    </div>
  </div>
</section>
